# Shared settings. Never type these into code (see Docs/MAINTENANCE.md).

llm:
  # Groq-hosted model used for all live answers.
  model: "openai/gpt-oss-20b"
  # 0 makes runs repeatable. If the model rejects this setting,
  # change it to null.
  temperature: 0
  seed: 42
  # Give up on a call after this many seconds instead of hanging.
  timeout_seconds: 30
  # Cap on reply length. Left null until tested: some models count hidden
  # "thinking" tokens towards it, and too low a cap cuts the reply off.
  max_output_tokens: null
  # Set these to the current Groq model prices per 1M tokens to enable cost estimates.
  # Zero avoids reporting outdated OpenAI prices as Groq costs.
  pricing:
    input_per_1m: 0.0
    output_per_1m: 0.0

judge:
  model: openai/gpt-oss-20b

supervisor:
  # Default decomposition setting for the sequential pipeline and P3 graph.
  # On by default: it answers mixed price-and-policy questions far more often
  # (report section 7.2). The ablation runner overrides this per request to compare A and B.
  decompose: true

usage_logging:
  enabled: true
  # Relative to the repository root. Local CSVs are excluded from Git.
  directory: logs/usage

experiment_measurements:
  # Sampling interval for local CPU/memory measurements during batch evaluation.
  memory_sampling_interval_seconds: 0.1

self_check:
  # P3's self check loop (agents/graph/self_check.py). A weak answer is
  # sent back at most this many times; the diagram says once.
  max_retries: 1
  # true: after the free code checks pass, one more model call reviews the
  # answer against the synthesis rules A1-A8. false: code checks only.
  llm_check: true

agents:
  # The price agent has no stub anymore; it always runs for real.
  # Policy can still be run as "stub" (fake data in the agreed shape) to
  # build/test/run the pipeline without the real policy dependencies.
  policy: real
  # How many policy passages to retrieve (passed to P5's agent).
  policy_top_k: 10

price_agent:
  raw_data: data/raw/ResaleflatpricesbasedonregistrationdatefromJan2017onwards.csv
  cleaned_data: data/cleaned/hdb_resale_prices.csv.gz
  # Vague or missing periods use the latest 12 complete months.
  default_months: 12
  # A: extract filters, then calculate in Python. B: text-to-SQL.
  approach: A

data_preparation:
  chunking:
    input: data/cleaned/deduplicated_documents.jsonl
    output: data/processed/chunks.jsonl
    report: reports/chunking_report.csv
    summary: reports/chunking_summary.md
    validation_report: reports/chunking_validation.csv
    raw_root: data/raw
    # Chunk by the embedding model's own tokenizer, sized to its input
    # limit, so a chunk is never truncated when it's embedded.
    tokenizer: BAAI/bge-base-en-v1.5
    target_chunk_size: 400
    max_chunk_size: 512
    chunk_overlap: 0
  quality:
    documents: data/cleaned/deduplicated_documents.jsonl
    chunks: data/processed/chunks.jsonl
    inventory: reports/file_inventory.csv
    duplicate_report: reports/duplicate_report.csv
    content_validation: reports/cleaning_content_validation.csv
    raw_root: data/raw
    report: reports/quality_report.csv
    summary: reports/data_quality_summary.md
    short_chunk_threshold: 10
    long_chunk_threshold: 500

  embedding:
    input: data/processed/chunks.jsonl
    output_dir: data/embeddings/bge-base-en-v1.5
    summary: reports/embedding_summary.md
    smoke_test: reports/embedding_smoke_test.csv
    model: BAAI/bge-base-en-v1.5
    batch_size: 16
    max_length: 512
    normalize: true

  vector_store:
    chunks: data/processed/chunks.jsonl
    embedding_dir: data/embeddings/bge-base-en-v1.5
    persist_directory: data/vector_db/chroma
    collection_name: hdb_housing_advisory_bge_base_v1_5
    distance_metric: cosine
    batch_size: 100
